name: Temporary Next Runtime Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm install --no-audit --no-fund
      - name: Package dependencies
        run: tar -czf next-runtime-dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: next-runtime-dependencies
          path: next-runtime-dependencies.tgz
          retention-days: 1
