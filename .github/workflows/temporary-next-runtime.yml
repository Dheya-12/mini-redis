name: Temporary Next Runtime Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact dependencies
        run: npm install --no-audit --no-fund
      - name: Package smaller dependency groups
        run: |
          tar -czf next-core.tgz node_modules/next
          tar -czf next-swc.tgz node_modules/@next/swc-*
          tar --exclude='node_modules/next' --exclude='node_modules/@next/swc-*' -czf next-rest.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: next-core
          path: next-core.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: next-swc
          path: next-swc.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: next-rest
          path: next-rest.tgz
          retention-days: 1
